<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Doctor</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#17202b; --muted:#5b6776; --line:#d6dce5;
  --accent:#2457d6; --accent-ink:#ffffff; --ok:#1f7a4d; --warn:#9a5b00; --bad:#b42318; --code:#f1f4f9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151c; --panel:#18202a; --ink:#e7ecf3; --muted:#9aa7b8; --line:#2b3644;
        --accent:#6f95ff; --accent-ink:#0b1220; --ok:#4cc38a; --warn:#e0a64a; --bad:#ff7b6e; --code:#101720;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,"Avenir Next","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h1{font-size:17px;margin:0;padding:18px 18px 4px;letter-spacing:.01em}
aside p{margin:0;padding:0 18px 14px;color:var(--muted);font-size:13px}
#history{overflow:auto;flex:1;border-top:1px solid var(--line)}
.h-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px;cursor:pointer}
.h-item:hover,.h-item[aria-current="true"]{background:var(--code)}
.h-item b{display:block;font-weight:600;font-size:13px}
.h-item span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.done{background:var(--ok)} .dot.error{background:var(--bad)} .dot.running{background:var(--warn)}
main{overflow:auto;padding:28px clamp(16px,4vw,48px)}
.wrap{max-width:820px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
textarea{resize:vertical;min-height:64px}
.row{display:grid;grid-template-columns:200px 1fr;gap:14px;margin-bottom:14px}
.actions{display:flex;gap:10px;align-items:center}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}
.err{color:var(--bad);font-size:13px}
/* the memorable part: the investigation trace */
.trace{margin:0;padding:0;list-style:none;border-left:2px solid var(--line);margin-left:6px}
.trace li{position:relative;padding:3px 0 9px 18px;font-size:14px}
.trace li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.trace li.tool::before{border-color:var(--accent)} .trace li.precheck::before{border-color:var(--warn)}
.trace li.live::before{background:var(--accent);border-color:var(--accent)}
.trace code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;color:var(--muted)}
.finding{margin:4px 0 0;font-size:13px;color:var(--muted)}
.diag h2{margin:0 0 6px;font-size:20px;line-height:1.3}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin:0 6px 8px 0}
.pill.high{color:var(--ok);border-color:var(--ok)} .pill.medium{color:var(--warn);border-color:var(--warn)} .pill.low{color:var(--bad);border-color:var(--bad)}
.diag h3{font-size:14px;margin:18px 0 6px}
.diag ul{margin:0;padding-left:20px}
pre{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow:auto;font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,monospace;margin:6px 0}
.muted{color:var(--muted)}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.trace li.live::before{animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Cluster Doctor</h1>
    <p>Past investigations</p>
    <div id="history"></div>
  </aside>
  <main><div class="wrap">
    <section class="card" id="auth">
      <label for="token">Access token</label>
      <div class="actions"><input id="token" type="password" autocomplete="off" placeholder="APP_TOKEN from your server">
      <button class="ghost" id="save-token">Save</button></div>
      <div class="err" id="auth-err" role="alert"></div>
    </section>

    <section class="card">
      <div class="row">
        <div><label for="ns">Namespace</label><select id="ns"></select></div>
        <div><label for="q">What's wrong? (optional)</label>
          <textarea id="q" maxlength="500" placeholder="e.g. payments API returns 503 since the last deploy"></textarea></div>
      </div>
      <div class="actions"><button class="primary" id="go">Investigate namespace</button><span class="err" id="go-err" role="alert"></span></div>
    </section>

    <section class="card" id="trace-card" hidden>
      <ol class="trace" id="trace" aria-live="polite"></ol>
    </section>

    <section class="card diag" id="diag" hidden></section>
  </div></main>
</div>

<script>
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
let token = store.get("cd_token") || "", pollTimer = null, currentId = null;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" } });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || r.statusText); }
  return r.json();
}

async function boot() {
  $("token").value = token;
  try {
    const nss = await api("/api/namespaces");
    $("ns").replaceChildren(...nss.map(n => el("option", { value: n }, n)));
    $("auth").hidden = true; $("auth-err").textContent = "";
    loadHistory();
  } catch (e) { $("auth").hidden = false; $("auth-err").textContent = token ? e.message : ""; }
}
$("save-token").onclick = () => { token = $("token").value.trim(); store.set("cd_token", token); boot(); };

async function loadHistory() {
  const items = await api("/api/investigations").catch(() => []);
  $("history").replaceChildren(...(items.length ? items.map(i => {
    const b = el("button", { class: "h-item", "aria-current": String(i.id === currentId) },
      el("b", {}, el("span", { class: "dot " + i.status }), i.namespace + " · " + new Date(i.created_at * 1000).toLocaleString()),
      el("span", {}, i.headline || i.question || i.status));
    b.onclick = () => show(i.id);
    return b;
  }) : [el("p", { class: "muted", style: "padding:14px 18px" }, "Nothing yet. Run your first investigation.")]));
}

$("go").onclick = async () => {
  $("go-err").textContent = ""; $("go").disabled = true;
  try {
    const { id } = await api("/api/investigations", { method: "POST", body: JSON.stringify({ namespace: $("ns").value, question: $("q").value }) });
    show(id);
  } catch (e) { $("go-err").textContent = e.message; $("go").disabled = false; }
};

function show(id) {
  currentId = id; clearTimeout(pollTimer); $("diag").hidden = true; poll();
}
async function poll() {
  let j;
  try { j = await api("/api/investigations/" + currentId); } catch (e) { $("go-err").textContent = e.message; $("go").disabled = false; return; }
  renderTrace(j);
  if (j.status === "running") { pollTimer = setTimeout(poll, 1000); return; }
  $("go").disabled = false;
  j.status === "done" && j.result ? renderDiag(j.result) : renderError(j.error);
  loadHistory();
}

function renderTrace(j) {
  $("trace-card").hidden = false;
  const items = (j.events || []).map(ev => {
    const li = el("li", { class: ev.kind });
    if (ev.kind === "tool") li.append(el("code", {}, ev.message));
    else li.append(ev.message);
    if (ev.kind === "precheck" && ev.data) ev.data.forEach(f => li.append(el("div", { class: "finding" }, `${f.pod}: ${f.category}${f.detail ? " — " + f.detail : ""}`)));
    return li;
  });
  if (j.status === "running") items.push(el("li", { class: "live" }, "Working…"));
  $("trace").replaceChildren(...items);
}

function list(title, arr) {
  return arr && arr.length ? [el("h3", {}, title), el("ul", {}, arr.map(x => el("li", {}, x)))] : [];
}
function renderDiag(r) {
  const d = $("diag"); d.hidden = false;
  const fix = r.fix || {};
  d.replaceChildren(
    el("span", { class: "pill" }, r.category || "Other"),
    el("span", { class: "pill " + (r.confidence?.level || "") }, (r.confidence?.level || "unknown") + " confidence"),
    el("h2", {}, r.root_cause),
    r.confidence?.reasoning ? el("p", { class: "muted" }, r.confidence.reasoning) : null,
    ...list("Affected", r.affected), ...list("Evidence", r.evidence),
    el("h3", {}, "Suggested fix"), el("p", {}, fix.summary || ""),
    ...(fix.commands || []).map(c => el("pre", {}, c)),
    fix.yaml_snippet ? el("pre", {}, fix.yaml_snippet) : null,
    ...list("Prevention", r.prevention),
    el("p", { class: "muted" }, "Review before applying. This tool never changes your cluster.")
  );
}
function renderError(msg) {
  const d = $("diag"); d.hidden = false;
  d.replaceChildren(el("h2", {}, "The investigation failed"), el("p", { class: "err" }, msg || "Unknown error"));
}
boot();
</script>
</body>
</html>
