# [err-storage] Pending: PVC references a StorageClass that does not exist
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: err-storage }
spec: { accessModes: [ReadWriteOnce], storageClassName: fast-ssd-missing, resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db-pvc, namespace: err-storage }
spec:
  replicas: 1
  selector: { matchLabels: { app: db-pvc } }
  template:
    metadata: { labels: { app: db-pvc } }
    spec:
      volumes: [{ name: data, persistentVolumeClaim: { claimName: data } }]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          volumeMounts: [{ name: data, mountPath: /data }]
