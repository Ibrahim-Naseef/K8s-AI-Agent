# [err-config] CreateContainerConfigError: Secret exists but the key is wrong
apiVersion: v1
kind: Secret
metadata: { name: db-secret, namespace: err-config }
stringData: { username: admin }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: key-missing, namespace: err-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: key-missing } }
  template:
    metadata: { labels: { app: key-missing } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: password } }
