# [err-quota] ReplicaFailure: ResourceQuota allows 1 pod, Deployment wants 3 (FailedCreate)
apiVersion: v1
kind: ResourceQuota
metadata: { name: tiny, namespace: err-quota }
spec: { hard: { pods: "1" } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: quota-victim, namespace: err-quota }
spec:
  replicas: 3
  selector: { matchLabels: { app: quota-victim } }
  template:
    metadata: { labels: { app: quota-victim } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
