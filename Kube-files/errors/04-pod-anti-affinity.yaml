# [err-scheduling] Pending: 3 replicas with required anti-affinity on a 1-node cluster
apiVersion: apps/v1
kind: Deployment
metadata: { name: spread, namespace: err-scheduling }
spec:
  replicas: 3
  selector: { matchLabels: { app: spread } }
  template:
    metadata: { labels: { app: spread } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: spread } }
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
