# [err-scheduling] Pending / Unschedulable: requests 100 CPUs, no node fits
apiVersion: apps/v1
kind: Deployment
metadata: { name: cpu-hog, namespace: err-scheduling }
spec:
  replicas: 1
  selector: { matchLabels: { app: cpu-hog } }
  template:
    metadata: { labels: { app: cpu-hog } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          resources: { requests: { cpu: "100" } }
