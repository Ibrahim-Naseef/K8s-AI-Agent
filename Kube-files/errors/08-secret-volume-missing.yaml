# [err-config] ContainerCreating (FailedMount): Secret volume does not exist
apiVersion: apps/v1
kind: Deployment
metadata: { name: mount-missing, namespace: err-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: mount-missing } }
  template:
    metadata: { labels: { app: mount-missing } }
    spec:
      volumes: [{ name: creds, secret: { secretName: no-such-secret } }]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          volumeMounts: [{ name: creds, mountPath: /creds }]
