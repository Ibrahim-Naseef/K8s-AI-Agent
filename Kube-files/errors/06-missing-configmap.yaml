# [err-config] CreateContainerConfigError: ConfigMap does not exist
apiVersion: apps/v1
kind: Deployment
metadata: { name: cfg-missing, namespace: err-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: cfg-missing } }
  template:
    metadata: { labels: { app: cfg-missing } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          env:
            - name: APP_MODE
              valueFrom: { configMapKeyRef: { name: app-settings, key: mode } }
