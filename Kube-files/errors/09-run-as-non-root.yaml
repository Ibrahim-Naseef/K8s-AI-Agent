# [err-config] CreateContainerConfigError: runAsNonRoot but image runs as root
apiVersion: apps/v1
kind: Deployment
metadata: { name: root-image, namespace: err-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: root-image } }
  template:
    metadata: { labels: { app: root-image } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          securityContext: { runAsNonRoot: true }
