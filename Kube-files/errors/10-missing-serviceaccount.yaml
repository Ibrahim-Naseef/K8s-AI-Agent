# [err-config] ReplicaFailure: ServiceAccount not found (FailedCreate)
apiVersion: apps/v1
kind: Deployment
metadata: { name: no-sa, namespace: err-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: no-sa } }
  template:
    metadata: { labels: { app: no-sa } }
    spec:
      serviceAccountName: ghost-sa
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
