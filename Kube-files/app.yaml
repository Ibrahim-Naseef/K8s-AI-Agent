# Create the secret first (never commit real values):
#   kubectl -n k8s-ai-agent create secret generic k8s-ai-agent-secrets \
#     --from-literal=LLM_API_KEY=sk-or-...   # APP_TOKEN is optional (empty = localhost/port-forward only)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: k8s-ai-agent-data, namespace: k8s-ai-agent }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: k8s-ai-agent, namespace: k8s-ai-agent }
spec:
  replicas: 1            # SQLite + in-memory jobs => keep a single replica
  strategy: { type: Recreate }
  selector: { matchLabels: { app: k8s-ai-agent } }
  template:
    metadata: { labels: { app: k8s-ai-agent } }
    spec:
      serviceAccountName: k8s-ai-agent
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: app
          image: k8s-ai-agent:0.1.0     # <- replace with your registry image, or load into kind
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: k8s-ai-agent-secrets } }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: k8s-ai-agent-data }
---
apiVersion: v1
kind: Service
metadata: { name: k8s-ai-agent, namespace: k8s-ai-agent }
spec:
  selector: { app: k8s-ai-agent }
  ports: [{ port: 80, targetPort: 8000 }]
